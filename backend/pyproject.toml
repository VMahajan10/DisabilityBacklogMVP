[project]
name = "dds-copilot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "openai>=3.54.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.3",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
